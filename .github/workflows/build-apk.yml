name: Build LG Control Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npm run cap:sync

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename and Prepare APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/LG-Control.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LG-Control-APK
          path: build-output/LG-Control.apk
          retention-days: 30

      - name: Release APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: android-latest
          name: "LG Control Android App (Latest)"
          body: |
            ### 📱 LG Control — Standalone Android App
            
            Download and install this APK on your Android phone to operate your LG TV directly over your home Wi-Fi.
            
            - **No computer or laptop needed**
            - **No bridge server needed**
            - **Direct Wi-Fi connection to LG Smart TV (wss://192.168.1.10:3001)**
            - **Includes Volume, Navigation, YouTube Search & Media controls**
            
            #### How to Install:
            1. Download `LG-Control.apk` below on your Android phone.
            2. Tap the downloaded file to install (allow "Install unknown apps" if prompted).
            3. Make sure your phone is connected to the same Wi-Fi as your TV.
            4. Open **LG Control**, tap **Connect**, and accept the prompt on your TV screen!
          files: build-output/LG-Control.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
